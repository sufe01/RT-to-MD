<style>
:root{color-scheme:light;--fg:#1f2328;--mut:#6a737d;--bd:#e5e7eb;--ac:#4f46e5;--acs:#eef2ff;--bg:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Google Sans Flex","Google Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;display:flex;gap:8px;align-items:center;min-width:220px}
header h1 svg{color:var(--ac)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--fg);font:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--acs);border-color:#c7d2fe}.btn svg{width:17px;height:17px;flex:none}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{background:#4338ca}
.ib{width:36px;height:36px;padding:0;justify-content:center;position:relative}
#tb{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
.cl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cl i.bar{position:absolute;bottom:5px;left:10px;right:10px;height:3px;border-radius:3px}
main{max-width:1180px;margin:0 auto;padding:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.grow{flex:1}
.wrap{display:grid;grid-template-columns:1fr;gap:14px}.wrap.show{grid-template-columns:1fr 1fr}
@media(max-width:820px){.wrap.show{grid-template-columns:1fr}}
#mdp{display:none}.wrap.show #mdp{display:block}
.paper{background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#ed{min-height:520px;max-height:78vh;overflow:auto;padding:24px 28px;outline:none}
#ed:empty:before{content:attr(data-ph);color:var(--mut)}
#ed img{cursor:pointer}#ed img.sel{outline:3px solid var(--ac);outline-offset:2px}
.cb{position:relative}.copybtn{position:absolute;top:8px;right:8px;border:1px solid var(--bd);background:#fff;border-radius:999px;font:12px inherit;padding:3px 11px;cursor:pointer;user-select:none}
#mdp .paper{padding:14px}#mdp h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#mdp h2 .ts-wrapper{width:150px;text-transform:none;letter-spacing:0}
#out{width:100%;height:60vh;min-height:420px;border:0;outline:0;resize:vertical;font:13px/1.5 Consolas,ui-monospace,Menlo,monospace;color:var(--fg)}

.bub,#ctx{position:fixed;z-index:50;display:none;background:#fff;border:1px solid var(--bd);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:4px 6px;max-width:96vw;gap:3px;align-items:center;flex-wrap:wrap}
#ctx{border-radius:18px}#ctx .lb{font-size:13px;color:var(--mut);margin:0 4px}#ctx input[type=range]{width:110px;accent-color:var(--ac)}
.bub .btn,#ctx .btn{border:0}
.menu{position:relative}.dm{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;z-index:40;min-width:200px}
.dm.open{display:block}.dm button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;font:inherit;padding:9px 12px;border-radius:999px;cursor:pointer;text-align:left}.dm button:hover{background:var(--acs)}
.dm svg{width:17px;height:17px}
.ts-control{border-radius:999px!important;padding:6px 14px!important;min-height:36px;border-color:var(--bd)!important}.ts-dropdown{border-radius:14px!important;z-index:60}
#tb .ts-wrapper{width:170px}.acts .ts-wrapper{width:200px}
.swal2-popup{border-radius:22px!important;font-family:inherit!important}.swal2-styled,.swal2-input{border-radius:999px!important}

footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}

<body>
<header>
  <h1><i data-lucide="pen-line"></i>Rich Text to Markdown Editor</h1>
  <a class="btn" href="how-to-use.html"><i data-lucide="book-open"></i>How to use</a>
</header>
<div id="tb"></div>
<main>
  <div class="acts">
    <label class="btn"><i data-lucide="folder-open"></i>Open .docx / .html<input id="fopen" type="file" hidden accept=".docx,.html,.htm"></label>
    <label class="btn"><i data-lucide="upload"></i>Add my own font<input id="fup" type="file" hidden accept=".ttf,.otf,.woff,.woff2"></label>
    <span class="grow"></span>
    <select id="imgm" class="ts" title="What to do with pictures in the Markdown">
      <option value="keep">Markdown pictures: keep</option><option value="embed">Markdown pictures: embed links</option><option value="remove">Markdown pictures: remove</option></select>
    <button class="btn" id="tg"><i data-lucide="eye"></i><span>Show Markdown</span></button>
    <button class="btn" id="cpmd"><i data-lucide="copy"></i><span>Copy Markdown</span></button>
    <div class="menu">
      <button class="btn p" id="dlb"><i data-lucide="download"></i>Download<i data-lucide="chevron-down"></i></button>
      <div class="dm" id="dm">
        <button data-x="pdf"><i data-lucide="file-down"></i>PDF (.pdf)</button>
        <button data-x="doc"><i data-lucide="file-text"></i>Word (.doc)</button>
        <button data-x="md"><i data-lucide="hash"></i>Markdown (.md)</button>
        <button data-x="html"><i data-lucide="file-code"></i>Web page (.html)</button>
        <button data-x="txt"><i data-lucide="file"></i>Plain text (.txt)</button>
      </div>
    </div>
    <button class="btn ib" id="clrall" title="Clear everything"><i data-lucide="trash-2"></i></button>
  </div>
  <div class="wrap" id="wrap">
    <div class="paper"><div id="ed" class="doc" contenteditable="true" spellcheck="true" data-ph="Start typing, or paste text, tables and pictures here. Select any text to see formatting tools."></div></div>
    <div id="mdp"><div class="paper">
      <h2>Markdown
        <select id="hd" class="ts"><option value="atx"># Headings</option><option value="setext">Underlined headings</option></select>
        <select id="bl" class="ts"><option value="-">Bullets: -</option><option value="*">Bullets: *</option><option value="+">Bullets: +</option></select></h2>
      <textarea id="out" spellcheck="false" readonly></textarea><div class="st" id="st"></div>
    </div></div>
  </div>
</main>
<div class="bub" id="bub"></div>
<div id="ctx"></div>
<input id="pic" type="file" hidden accept="image/*">
<footer>Colors, sizes, fonts, alignment and picture styles appear in PDF, Word and HTML downloads. Markdown keeps the structure only.</footer>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const $=id=>document.getElementById(id),ed=$('ed'),out=$('out'),ctx=$('ctx'),bub=$('bub');
const Sw=Swal.mixin({confirmButtonColor:'#4f46e5',denyButtonColor:'#0ea5e9'});
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const unwrap=el=>el.replaceWith(...el.childNodes);
const ex=(c,v)=>document.execCommand(c,false,v);
/* ---------- toolbar ---------- */
const D={undo:['undo-2','Undo'],redo:['redo-2','Redo'],h1:['heading-1','Heading 1'],h2:['heading-2','Heading 2'],h3:['heading-3','Heading 3'],p:['pilcrow','Normal text'],
 b:['bold','Bold'],i:['italic','Italic'],u:['underline','Underline'],s:['strikethrough','Strikethrough'],hl:['highlighter','Highlight'],
 ul:['list','Bullet list'],ol:['list-ordered','Numbered list'],q:['quote','Quote'],al:['align-left','Align left'],ac:['align-center','Align center'],ar:['align-right','Align right'],aj:['align-justify','Justify'],
 link:['link','Add link'],img:['image','Insert picture'],tbl:['table','Insert table'],code:['code','Inline code'],cb:['square-code','Code block'],clr:['eraser','Clear formatting'],
 szu:['a-arrow-up','Bigger text'],szd:['a-arrow-down','Smaller text']};
const btns=l=>l.map(k=>k==='|'?'<span class="sep"></span>':'<button class="btn ib" data-c="'+k+'" title="'+D[k][1]+'"><i data-lucide="'+D[k][0]+'"></i></button>').join('');
const FONTS=['Google Sans Flex','Poppins','Montserrat','Inter','Roboto','Arial','Georgia','Consolas'];
$('tb').innerHTML=btns(['undo','redo','|'])+'<select id="font">'+FONTS.map(f=>'<option>'+f+'</option>').join('')+'</select>'+
 btns(['szd','szu','|','h1','h2','h3','|','b','i','u','s','hl','|'])+
 '<label class="btn ib cl" title="Text color"><i data-lucide="baseline"></i><input type="color" id="fc" value="#e11d48"><i class="bar" id="fcb" style="background:#e11d48"></i></label>'+
 '<label class="btn ib cl" title="Background color"><i data-lucide="paint-bucket"></i><input type="color" id="bc" value="#fde68a"><i class="bar" id="bcb" style="background:#fde68a"></i></label>'+
 btns(['|','ul','ol','q','|','al','ac','ar','aj','|','link','img','tbl','code','cb','|','clr']);
bub.innerHTML=btns(['h1','h2','h3','|','b','i','u','s','hl','|','link','code','clr']);
/* ---------- fonts ---------- */
const fam=n=>'"'+n+'",'+(/consolas|mono|courier/i.test(n)?'monospace':/georgia|times/i.test(n)?'serif':'sans-serif');
const rf=(d,e)=>'<div style="font-family:'+fam(d.value).replace(/"/g,"'")+'">'+e(d.text)+'</div>';
const fts=new TomSelect('#font',{create:true,render:{option:rf,item:rf}});
fts.setValue('Google Sans Flex',true);ed.style.fontFamily=fam('Google Sans Flex');
fts.on('change',v=>{if(!v)return;if(lr&&!lr.collapsed){restore();ex('fontName',v)}else ed.style.fontFamily=fam(v);later()});
$('fup').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const n=f.name.replace(/\.[^.]+$/,'').replace(/[^\w ]+/g,' ').trim()||'MyFont';const ff=new FontFace(n,await f.arrayBuffer());await ff.load();document.fonts.add(ff);
    fts.addOption({value:n,text:n});fts.setValue(n)}catch(x){Sw.fire('Could not load that font','Please choose a .ttf, .otf, .woff or .woff2 file.','error')}e.target.value=''};
document.querySelectorAll('select.ts').forEach(s=>new TomSelect(s,{controlInput:null,onChange:()=>run()}));
/* ---------- markdown ---------- */
const td=new TurndownService({headingStyle:'atx',bulletListMarker:'-',codeBlockStyle:'fenced',emDelimiter:'*'});td.use(turndownPluginGfm.gfm);
const BOLD=/font-weight:\s*(700|800|900|bold)/,ITAL=/font-style:\s*italic/;
td.addRule('styledSpan',{filter:n=>n.nodeName==='SPAN'&&(BOLD.test(n.getAttribute('style')||'')||ITAL.test(n.getAttribute('style')||'')),
 replacement:(c,n)=>{const s=n.getAttribute('style');if(!c.trim())return c;let o=c.trim();if(ITAL.test(s))o='*'+o+'*';if(BOLD.test(s))o='**'+o+'**';return ' '+o+' '}});
td.addRule('htmlInline',{filter:['u','mark'],replacement:(c,n)=>{const t=n.nodeName.toLowerCase();return '<'+t+'>'+c+'</'+t+'>'}});
function clean(doc){
 doc.querySelectorAll('.copybtn,meta,style,script').forEach(e=>e.remove());
 doc.querySelectorAll('.cb,b[id^="docs-internal-guid"]').forEach(unwrap);
 doc.querySelectorAll('table').forEach(t=>{
  t.querySelectorAll('td,th').forEach(c=>{c.querySelectorAll('p,div').forEach(p=>{p.after(' ');unwrap(p)});c.innerHTML=c.innerHTML.replace(/\|/g,'&#124;').replace(/\s+/g,' ').trim()});
  if(!t.querySelector('th')){const r=t.querySelector('tr');if(r)r.querySelectorAll('td').forEach(c=>{const h=doc.createElement('th');h.innerHTML=c.innerHTML;c.replaceWith(h)})}});
 doc.querySelectorAll('li > p').forEach(unwrap)}
const toData=async s=>{const b=await(await fetch(s)).blob();return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
let tick=0;
async function run(){const my=++tick;td.options.headingStyle=$('hd').value;td.options.bulletListMarker=$('bl').value;
 const doc=new DOMParser().parseFromString(ed.innerHTML,'text/html');clean(doc);const m=$('imgm').value;
 for(const im of [...doc.querySelectorAll('img')]){const s=im.getAttribute('src')||'';if(m==='remove'){im.remove();continue}
  if(m==='embed'&&/^https?:/.test(s)){try{im.setAttribute('src',await toData(s))}catch(e){}}}
 if(my!==tick)return;const md=td.turndown(doc.body).replace(/\u200b/g,'').replace(/\n{3,}/g,'\n\n');
 out.value=md;$('st').textContent=md?(md.match(/\S+/g)||[]).length+' words, '+md.length+' characters':''}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(run,150)};ed.addEventListener('input',later);
/* ---------- selection helpers ---------- */
let lr=null,selImg=null;
const node=()=>{const n=getSelection().anchorNode;return n?(n.nodeType===1?n:n.parentElement):null};
function restore(){ed.focus();if(lr){const s=getSelection();s.removeAllRanges();s.addRange(lr)}}
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))lr=s.getRangeAt(0).cloneRange();upd()});
const cell=()=>{const n=node();const c=n&&n.closest('td,th');return c&&ed.contains(c)?c:null};
/* ---------- commands ---------- */
const fb=t=>ex('formatBlock',(document.queryCommandValue('formatBlock')||'').toLowerCase()===t?'<p>':'<'+t+'>');
function tog(tag){const s=getSelection();if(!s.rangeCount)return;const h=node().closest(tag);
 if(h&&ed.contains(h)){unwrap(h);return}const d=document.createElement('div');d.appendChild(s.getRangeAt(0).cloneContents());ex('insertHTML','<'+tag+'>'+d.innerHTML+'</'+tag+'>')}
function size(d){const s=getSelection(),e=node(),cur=parseFloat(getComputedStyle(e).fontSize);
 if(s.isCollapsed){const b=e.closest('p,h1,h2,h3,li,blockquote,td,th,div');if(b&&b!==ed)b.style.fontSize=Math.max(8,cur+d)+'px';return}
 const n=Math.max(8,cur+d);ex('fontSize','7');
 ed.querySelectorAll('font[size="7"]').forEach(f=>{const sp=document.createElement('span');sp.style.fontSize=n+'px';sp.append(...f.childNodes);f.replaceWith(sp)})}
function mkCopy(){const b=document.createElement('button');b.className='copybtn';b.contentEditable='false';b.textContent='Copy';return b}
function decorate(){ed.querySelectorAll('pre').forEach(p=>{if(p.parentElement.classList.contains('cb'))return;
 if(!p.querySelector('code')){const c=document.createElement('code');c.append(...p.childNodes);p.append(c)}
 const w=document.createElement('div');w.className='cb';p.replaceWith(w);w.append(mkCopy(),p)})}
function codeBlock(){const s=getSelection(),txt=s.rangeCount?s.toString():'';
 ex('insertHTML','<div class="cb nw"><button class="copybtn" contenteditable="false">Copy</button><pre><code>'+(esc(txt)||'\u200b')+'</code></pre></div><p><br></p>');
 const n=ed.querySelector('.cb.nw');if(n){n.classList.remove('nw');const r=document.createRange();r.selectNodeContents(n.querySelector('code'));r.collapse(false);s.removeAllRanges();s.addRange(r)}}
async function addLink(){const a=node().closest('a');
 const r=await Sw.fire({title:'Add a link',input:'text',inputValue:a?a.href:'',inputPlaceholder:'https://example.com',showCancelButton:true,confirmButtonText:'Apply'});
 if(!r.isConfirmed)return;restore();let u=(r.value||'').trim();
 if(!u)ex('unlink');else{if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;ex('createLink',u)}later()}
const putImg=src=>{restore();ex('insertHTML','<img src="'+esc(src)+'" alt="">');later()};
const readImg=f=>{const fr=new FileReader();fr.onload=()=>putImg(fr.result);fr.readAsDataURL(f)};
async function addImg(){const r=await Sw.fire({title:'Insert a picture',input:'text',inputPlaceholder:'Paste an image link (https://...)',showCancelButton:true,showDenyButton:true,confirmButtonText:'Use link',denyButtonText:'Upload from device'});
 if(r.isDenied)$('pic').click();else if(r.isConfirmed&&r.value)putImg(r.value.trim())}
$('pic').onchange=e=>{if(e.target.files[0])readImg(e.target.files[0]);e.target.value=''};
async function addTable(){const r=await Sw.fire({title:'Insert a table',html:'<div class="tdlg"><label>Rows<input id="tr" type="number" min="1" max="50" value="3"></label><label>Columns<input id="tc" type="number" min="1" max="20" value="3"></label></div><p style="font-size:14px;color:#6a737d">You can add or remove rows and columns later by clicking inside the table.</p>',showCancelButton:true,confirmButtonText:'Insert',preConfirm:()=>[+$('tr').value||3,+$('tc').value||3]});
 if(!r.isConfirmed)return;const [R,N]=[Math.min(50,Math.max(1,r.value[0])),Math.min(20,Math.max(1,r.value[1]))];
 const row=t=>'<tr>'+('<'+t+'>'+(t==='th'?'Header':'<br>')+'</'+t+'>').repeat(N)+'</tr>';
 restore();ex('insertHTML','<table><thead>'+row('th')+'</thead><tbody>'+row('td').repeat(R-1)+'</tbody></table><p><br></p>');later()}
const C={undo:()=>ex('undo'),redo:()=>ex('redo'),h1:()=>fb('h1'),h2:()=>fb('h2'),h3:()=>fb('h3'),p:()=>ex('formatBlock','<p>'),b:()=>ex('bold'),i:()=>ex('italic'),u:()=>ex('underline'),s:()=>ex('strikeThrough'),
 hl:()=>tog('mark'),ul:()=>ex('insertUnorderedList'),ol:()=>ex('insertOrderedList'),q:()=>fb('blockquote'),al:()=>ex('justifyLeft'),ac:()=>ex('justifyCenter'),ar:()=>ex('justifyRight'),aj:()=>ex('justifyFull'),
 szu:()=>size(2),szd:()=>size(-2),code:()=>tog('code'),cb:codeBlock,clr:()=>{ex('removeFormat');ex('formatBlock','<p>')},link:addLink,img:addImg,tbl:addTable};
document.addEventListener('mousedown',e=>{const t=e.target;if(t.closest('.bub,#tb,#ctx')&&!/INPUT|SELECT/.test(t.tagName)&&!t.closest('.ts-wrapper'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(!b)return;
 if(document.activeElement!==ed)restore();C[b.dataset.c]();later();upd()});
$('fc').addEventListener('input',e=>{$('fcb').style.background=e.target.value;restore();ex('foreColor',e.target.value);later()});
$('bc').addEventListener('input',e=>{$('bcb').style.background=e.target.value;restore();ex('hiliteColor',e.target.value);later()});
/* ---------- tables and pictures ---------- */
const newCell=(tag)=>{const d=document.createElement(tag);d.innerHTML=tag==='TH'?'Header':'<br>';return d};
const T={
 ar:()=>{const c=cell(),tr=c.parentElement,t=tr.closest('table'),n=document.createElement('tr');[...tr.cells].forEach(()=>n.append(newCell('TD')));
  if(tr.parentElement.tagName==='THEAD')(t.tBodies[0]||t.createTBody()).prepend(n);else tr.after(n)},
 ac:()=>{const c=cell(),i=c.cellIndex;[...c.closest('table').rows].forEach(r=>{const d=newCell(r.parentElement.tagName==='THEAD'?'TH':'TD');r.cells[i]?r.cells[i].after(d):r.append(d)})},
 dr:()=>{const c=cell(),t=c.closest('table');c.parentElement.remove();if(!t.rows.length)t.remove()},
 dc:()=>{const c=cell(),i=c.cellIndex,t=c.closest('table');[...t.rows].forEach(r=>r.cells[i]&&r.cells[i].remove());if(!t.rows[0]||!t.rows[0].cells.length)t.remove()},
 dt:()=>cell().closest('table').remove()};
const tblBar=()=>[['ar','plus','Row'],['ac','plus','Column'],['dr','minus','Row'],['dc','minus','Column'],['dt','trash-2','Table']].map(x=>'<button class="btn" data-t="'+x[0]+'"><i data-lucide="'+x[1]+'"></i>'+x[2]+'</button>').join('');
const imgBar=()=>'<span class="lb">Round corners</span><input type="range" id="rad" min="0" max="50" value="'+(parseInt(selImg.style.borderRadius)||0)+'">'+
 [25,50,75,100].map(n=>'<button class="btn" data-i="w'+n+'">'+n+'%</button>').join('')+
 [['l','align-left'],['c','align-center'],['r','align-right'],['del','trash-2']].map(x=>'<button class="btn ib" data-i="'+x[0]+'"><i data-lucide="'+x[1]+'"></i></button>').join('');
ctx.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)T[b.dataset.t]();else if(selImg){const m=b.dataset.i;
  if(m[0]==='w')selImg.style.width=m.slice(1)+'%';
  else if(m==='del'){selImg.remove();selImg=null}
  else{selImg.style.display='block';selImg.style.margin=m==='l'?'8px auto 8px 0':m==='r'?'8px 0 8px auto':'8px auto'}}
 later();upd()});
ctx.addEventListener('input',e=>{if(e.target.id==='rad'&&selImg){selImg.style.borderRadius=e.target.value+'%';later()}});
ed.addEventListener('click',e=>{const t=e.target;
 if(t.classList.contains('copybtn')){navigator.clipboard.writeText(t.parentElement.querySelector('pre').textContent).catch(()=>{});t.textContent='Copied';setTimeout(()=>t.textContent='Copy',1200)}
 if(selImg)selImg.classList.remove('sel');selImg=t.tagName==='IMG'?t:null;if(selImg)selImg.classList.add('sel');upd()});
function upd(){
 const s=getSelection();let show=s.rangeCount&&!s.isCollapsed&&ed.contains(s.anchorNode)&&ed.contains(s.focusNode),r=show&&s.getRangeAt(0).getBoundingClientRect();
 if(show&&(r.width||r.height)){bub.style.display='flex';const w=bub.offsetWidth,h=bub.offsetHeight;let top=r.top-h-8;if(top<8)top=r.bottom+8;
  bub.style.top=top+'px';bub.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px'}else bub.style.display='none';
 let el=null,k='';if(selImg&&ed.contains(selImg)){el=selImg;k='img'}else{const c=cell();if(c){el=c.closest('table');k='tbl'}}
 if(!el){ctx.style.display='none';ctx._el=null;return}
 if(ctx._el!==el){ctx.innerHTML=k==='img'?imgBar():tblBar();ctx._el=el;lucide.createIcons()}
 ctx.style.display='flex';const q=el.getBoundingClientRect(),w=ctx.offsetWidth,h=ctx.offsetHeight;
 ctx.style.top=(k==='img'?Math.max(8,q.top-h-8):Math.min(innerHeight-h-8,q.bottom+8))+'px';ctx.style.left=Math.max(8,Math.min(innerWidth-w-8,q.left))+'px'}
addEventListener('scroll',upd,true);addEventListener('resize',upd);
ed.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const n=node();if(n&&n.closest('li')){e.preventDefault();ex(e.shiftKey?'outdent':'indent');later()}});
ed.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const fs=[...cd.files].filter(f=>f.type.startsWith('image/'));
 if(fs.length&&!cd.getData('text/html')){e.preventDefault();fs.forEach(readImg)}else setTimeout(()=>{decorate();run()},60)});
/* ---------- files, export ---------- */
$('fopen').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{ed.innerHTML=/\.docx$/i.test(f.name)?(await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value:await f.text();decorate();run()}
 catch(x){Sw.fire('Could not open that file','','error')}e.target.value=''};
const fname=()=>(((ed.querySelector('h1,h2,h3')||{}).textContent||'document').trim().replace(/[^\w\- ]+/g,'').slice(0,40))||'document';
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function snap(){const c=ed.cloneNode(true);c.querySelectorAll('.copybtn').forEach(b=>b.remove());c.querySelectorAll('.sel').forEach(i=>i.classList.remove('sel'));
 c.removeAttribute('contenteditable');c.removeAttribute('id');c.removeAttribute('data-ph');return c}
const css=()=>$('docstyle').textContent;
const X={
 md:()=>save(new Blob([out.value],{type:'text/markdown'}),fname()+'.md'),
 pdf:()=>{Sw.fire({toast:true,position:'top',title:'Preparing your PDF...',showConfirmButton:false,timer:2000});
  html2pdf().set({margin:12,filename:fname()+'.pdf',image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4'}}).from(snap()).save()},
 doc:()=>save(new Blob(['<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>'+css()+'</style></head><body>'+snap().outerHTML+'</body></html>'],{type:'application/msword'}),fname()+'.doc'),
 html:()=>save(new Blob(['<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(fname())+'</title><style>body{max-width:800px;margin:40px auto;padding:0 16px}'+css()+'</style></head><body>'+snap().outerHTML+'</body></html>'],{type:'text/html'}),fname()+'.html'),
 txt:()=>save(new Blob([ed.innerText],{type:'text/plain'}),fname()+'.txt')};
$('dlb').onclick=e=>{e.stopPropagation();$('dm').classList.toggle('open')};
$('dm').onclick=e=>{const b=e.target.closest('button');if(b){X[b.dataset.x]();$('dm').classList.remove('open')}};
document.addEventListener('click',()=>$('dm').classList.remove('open'));
$('tg').onclick=()=>{const w=$('wrap').classList.toggle('show');$('tg').querySelector('span').textContent=w?'Hide Markdown':'Show Markdown'};
$('cpmd').onclick=async()=>{await run();try{await navigator.clipboard.writeText(out.value)}catch(x){out.select();document.execCommand('copy')}
 const s=$('cpmd').querySelector('span');s.textContent='Copied!';setTimeout(()=>s.textContent='Copy Markdown',1300)};
$('clrall').onclick=async()=>{const r=await Sw.fire({title:'Clear everything?',text:'This removes all the content in the editor.',icon:'warning',showCancelButton:true,confirmButtonText:'Yes, clear it'});
 if(r.isConfirmed){ed.innerHTML='';selImg=null;run();upd()}};
lucide.createIcons();
</script>
